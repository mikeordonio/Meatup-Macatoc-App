<ion-content class="auth-content">
  <div class="auth-container">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <h1>Reset your password</h1>
      <p>Enter your account email and we will send instructions to reset your password.</p>

      <ion-item>
        <ion-input label="Email" labelPlacement="stacked" type="email" formControlName="email"></ion-input>
      </ion-item>

      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p>{{ successMessage }}</p>
      }
      <ion-button expand="block" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Sending...' : 'Send reset link' }}
      </ion-button>
      <a class="auth-link" routerLink="/auth/login">Back to sign in</a>
    </form>
  </div>
</ion-content>
